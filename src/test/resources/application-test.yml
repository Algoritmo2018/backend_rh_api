# Integration tests (Testcontainers provides PostgreSQL through @ServiceConnection and Mailpit
# through a DynamicPropertyRegistrar, see TestcontainersConfiguration)
spring:
  mail:
    # Placeholders so the mail auto-configuration is enabled; the real host/port of the Mailpit
    # container are set by TestcontainersConfiguration (DynamicPropertyRegistrar)
    host: localhost
    port: 1025
  flyway:
    # Test-only tables (see db/test-migration)
    locations: classpath:db/migration,classpath:db/test-migration

app:
  frontend-url: http://localhost:5173/software_rh
  candidate-portal-url: http://localhost:5173/software_rh/candidato
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef-0123
  auth:
    otp-login-enabled: true
    rate-limits:
      # Lower than production (100 and 30) only so the per-IP tests stay fast: every login attempt
      # hashes a password. The other limits keep their production values.
      login: { max: 20, window: 15m }
      register: { max: 5, window: 1h }
    token-pepper: test-only-token-pepper-0123456789abcdef
  contact:
    rate-limits:
      # Lower than production (20) so the per-IP test stays short; per email keeps its value (3)
      per-ip: { max: 5, window: 1h }
      per-email: { max: 3, window: 1h }
  mail:
    from: FEH OIRAM <nao-responder@fehoiram.test>
    # The test SMTP servers (Mailpit, refused ports) are on the local machine
    block-private-hosts: false
    outbox:
      # Emails leave quickly in tests (they are awaited in Mailpit)
      poll-interval: 200ms
  storage:
    local:
      root: ${java.io.tmpdir}/recrutamento-api-test-uploads
  notifications:
    allow-simulated-sms: true
  bootstrap:
    admin:
      email: bootstrap-admin@fehoiram.test
      name: Administrador Inicial
      phone: "929999999"
