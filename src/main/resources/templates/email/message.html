<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Assunto</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5fa;font-family:Arial,Helvetica,sans-serif;color:#1f2547;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f5fa;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;">
                <tr>
                    <td style="background-color:#456fa3;padding:20px 32px;color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:0.5px;"
                        th:text="#{email.layout.brand}">FEH OIRAM</td>
                </tr>
                <tr>
                    <!-- bodyHtml comes from TemplateRenderer.renderHtml: every character already escaped, only <br> added -->
                    <td style="padding:32px;font-size:15px;line-height:1.6;" th:utext="${bodyHtml}">Mensagem</td>
                </tr>
                <tr>
                    <td style="background-color:#f4f5fa;padding:16px 32px;color:#8a8fa8;font-size:12px;line-height:1.5;"
                        th:text="#{email.message.footer}">Rodapé</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
