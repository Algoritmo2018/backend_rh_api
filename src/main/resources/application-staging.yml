# Local staging: the whole system in Docker (deploy/docker-compose.staging.yml), behind the Nginx of the frontend
# image. Same shape as prod (every value from environment variables, see deploy/.env.staging.example) plus the
# settings needed to test on one machine. Never use it on a public server: use prod.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    # Mailpit on the Docker network (no authentication)
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}

server:
  # Safe only because the backend publishes no port: the Nginx in front of it is the only client and it
  # overwrites X-Forwarded-For with the address it sees (per-IP rate limits)
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never

app:
  frontend-url: ${APP_FRONTEND_URL}
  candidate-portal-url: ${APP_CANDIDATE_PORTAL_URL}
  cors:
    # Frontend and API share the origin through Nginx; the list cannot be empty
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${APP_JWT_SECRET}
  auth:
    token-pepper: ${APP_AUTH_TOKEN_PEPPER}
    # Same roles as prod (candidates only); the codes are in the backend log (simulated SMS)
    otp-login-enabled: true
  mail:
    from: ${APP_MAIL_FROM}
    # Mailpit is on a private Docker network
    block-private-hosts: false
    outbox:
      poll-interval: 2s
  storage:
    type: s3
    s3:
      # MinIO of the compose file: private bucket, created by the application, encrypted (SSE-S3)
      endpoint: ${APP_STORAGE_S3_ENDPOINT}
      region: us-east-1
      bucket: ${APP_STORAGE_S3_BUCKET:recrutamento-files}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY}
      path-style: true
      create-bucket: true
  notifications:
    # No SMS provider: SMS codes (2FA, SMS login, phone change) are written to the log (docker compose logs backend)
    allow-simulated-sms: true
    log-message-content: true
  bootstrap:
    admin:
      # Created (with an invitation in Mailpit) only when no administrator has a password, i.e. without the dev seed
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@fehoiram.local}
      name: ${APP_BOOTSTRAP_ADMIN_NAME:Administrador Local}
      phone: ${APP_BOOTSTRAP_ADMIN_PHONE:923000000}
