# Base configuration shared by every profile.
# No secrets here: profile files (dev) or environment variables (prod) provide them.
spring:
  application:
    name: recrutamento-api
  threads:
    virtual:
      # @Async listeners (notifications) and request handling run on virtual threads
      enabled: true
  docker:
    compose:
      # Only the dev profile starts docker compose automatically
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    # User-facing messages are in Portuguese (Angola)
    locale: pt_AO
    locale-resolver: fixed
    error:
      # The fallback /error page never exposes internals (the API errors use GlobalExceptionHandler)
      include-stacktrace: never
      include-message: never
  thymeleaf:
    # Only used for email templates, not for web pages
    check-template-location: true
  mail:
    default-encoding: UTF-8
  servlet:
    multipart:
      # Only the company logo (300 KB) for now; raised in stage 6 (CVs and documents)
      max-file-size: 1MB
      max-request-size: 1MB
  cache:
    type: caffeine
    # Catalogs change rarely; writes evict them. The expiry bounds staleness with several instances.
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  # Only set to "framework" behind a trusted reverse proxy that overwrites X-Forwarded-For
  # (otherwise clients can spoof their IP and bypass the rate limits). See README.
  forward-headers-strategy: none
  tomcat:
    # Tomcat reads (and discards) up to this much of a rejected upload, so the client still gets the
    # 413 JSON answer instead of a reset connection
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  defaults:
    nationality: Angolana
    language: Português
    # Time zone used to show dates to users (emails, SMS); everything is stored in UTC
    time-zone: Africa/Luanda
  jwt:
    issuer: recrutamento-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-family-max-age: 30d
    refresh-reuse-grace-period: 20s
  auth:
    # Phone + SMS code login. Disabled unless explicitly enabled (needs a real SMS provider)
    otp-login-enabled: false
    # Roles allowed to log in by phone: candidates only (dev allows every role)
    otp-login-roles: [candidate]
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-resend-cooldown: 60s
    otp-max-per-phone-per-hour: 5
    two-factor-challenge-ttl: 5m
    two-factor-max-attempts: 5
    password-reset-ttl: 1h
    invitation-ttl: 7d
    email-verification-ttl: 48h
    max-failed-logins: 5
    lockout-duration: 15m
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: true
      same-site: Strict
    # Per-IP limits are generous because of CGNAT (mobile operators share one IP among many
    # customers); the per-account / per-email / per-phone limits are the main protection.
    rate-limits:
      max-entries: 100000
      # Per IP (the account lockout above is the main protection against password guessing)
      login: { max: 100, window: 15m }
      otp-request: { max: 60, window: 1h }
      otp-verify: { max: 10, window: 15m }
      forgot-password: { max: 30, window: 1h }
      register: { max: 30, window: 1h }
      # Per email address
      forgot-password-per-email: { max: 3, window: 1h }
      # Per email and per phone number
      register-per-identity: { max: 3, window: 1h }
      # Per user: checks of the current password (change password, disable 2FA, change phone)
      password-confirmation: { max: 10, window: 15m }
  storage:
    local:
      # Uploaded files (local disk until the S3 implementation in stage 6)
      root: ./data/uploads
  notifications:
    # Allow features that need SMS (2FA, OTP login) with the log-only SMS sender (dev/test only)
    allow-simulated-sms: false
    # Log the full content of simulated SMS/WhatsApp messages (dev only: they contain codes)
    log-message-content: false
