# Base configuration shared by every profile.
# No secrets here: profile files (dev) or environment variables (prod) provide them.
spring:
  application:
    name: recrutamento-api
  threads:
    virtual:
      # @Async listeners (notifications) and request handling run on virtual threads
      enabled: true
  docker:
    compose:
      # Only the dev profile starts docker compose automatically
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    # User-facing messages are in Portuguese (Angola)
    locale: pt_AO
    locale-resolver: fixed
    error:
      # The fallback /error page never exposes internals (the API errors use GlobalExceptionHandler)
      include-stacktrace: never
      include-message: never
  thymeleaf:
    # Only used for email templates, not for web pages
    check-template-location: true
  mail:
    default-encoding: UTF-8
  servlet:
    multipart:
      # Largest upload: candidate documents (10 MB). Each endpoint checks its own, lower limit
      # (logo 300 KB, photo 2 MB, CV 5 MB). The request also carries the form fields.
      max-file-size: 10MB
      max-request-size: 11MB
  cache:
    type: caffeine
    # Catalogs change rarely; writes evict them. The expiry bounds staleness with several instances.
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  # Only set to "framework" behind a trusted reverse proxy that overwrites X-Forwarded-For
  # (otherwise clients can spoof their IP and bypass the rate limits). See README.
  forward-headers-strategy: none
  tomcat:
    # Tomcat reads (and discards) up to this much of a rejected upload, so the client still gets the
    # 413 JSON answer instead of a reset connection
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  defaults:
    nationality: Angolana
    language: Português
    # Time zone used to show dates to users (emails, SMS); everything is stored in UTC
    time-zone: Africa/Luanda
  jwt:
    issuer: recrutamento-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-family-max-age: 30d
    refresh-reuse-grace-period: 20s
  auth:
    # Phone + SMS code login. Disabled unless explicitly enabled (needs a real SMS provider)
    otp-login-enabled: false
    # Roles allowed to log in by phone: candidates only (dev allows every role)
    otp-login-roles: [candidate]
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-resend-cooldown: 60s
    otp-max-per-phone-per-hour: 5
    two-factor-challenge-ttl: 5m
    two-factor-max-attempts: 5
    password-reset-ttl: 1h
    invitation-ttl: 7d
    email-verification-ttl: 48h
    max-failed-logins: 5
    lockout-duration: 15m
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: true
      same-site: Strict
    # Per-IP limits are generous because of CGNAT (mobile operators share one IP among many
    # customers); the per-account / per-email / per-phone limits are the main protection.
    rate-limits:
      max-entries: 100000
      # Per IP (the account lockout above is the main protection against password guessing)
      login: { max: 100, window: 15m }
      otp-request: { max: 60, window: 1h }
      otp-verify: { max: 10, window: 15m }
      forgot-password: { max: 30, window: 1h }
      register: { max: 30, window: 1h }
      # Per email address
      forgot-password-per-email: { max: 3, window: 1h }
      # Per email and per phone number
      register-per-identity: { max: 3, window: 1h }
      # Per user: checks of the current password (change password, disable 2FA, change phone)
      password-confirmation: { max: 10, window: 15m }
  contact:
    # Public forms "Precisa de recrutar?" and Contacto (CGNAT: per-IP generous, per-email strict)
    rate-limits:
      per-ip: { max: 20, window: 1h }
      per-email: { max: 3, window: 1h }
  storage:
    # s3 = S3 or MinIO (private bucket, encrypted at rest); local = local disk (only for experiments)
    type: s3
    local:
      root: ./data/uploads
    s3:
      # Empty for AWS S3; MinIO: http://host:9000
      endpoint: ${APP_STORAGE_S3_ENDPOINT:}
      region: ${APP_STORAGE_S3_REGION:us-east-1}
      bucket: ${APP_STORAGE_S3_BUCKET:recrutamento-files}
      # Empty → AWS default credentials chain. Secrets only from the environment (.env), never in git
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:}
      path-style: ${APP_STORAGE_S3_PATH_STYLE:true}
      # SSE-S3 (AES256) on every object; MinIO needs MINIO_KMS_SECRET_KEY (see .env.example)
      server-side-encryption: true
      # Production: the bucket is created (private) by the operators
      create-bucket: false
  notifications:
    # Allow features that need SMS (2FA, OTP login) with the log-only SMS sender (dev/test only)
    allow-simulated-sms: false
    # Log the full content of simulated SMS/WhatsApp messages (dev only: they contain codes)
    log-message-content: false
    # Bell: read notifications and every notification are deleted after these periods (daily job)
    read-retention: 90d
    retention: 180d
  mail:
    # SMTP accounts of the settings must be public servers (no loopback / link-local / private networks)
    block-private-hosts: true
    outbox:
      poll-interval: 10s
      batch-size: 20
      # Wait before each new attempt; after the last one the email is "failed" and the admins are told
      retry-delays: [1m, 5m, 30m, 2h, 6h]
      sent-retention: 30d
      failed-retention: 90d
  secrets:
    # AES-256-GCM key of the secrets stored in the database (SMTP passwords): 32 random bytes in base64
    # (openssl rand -base64 32). Only from the environment (.env), never in git.
    key: ${APP_SECRETS_KEY:}
    # Previous key while rotating (values encrypted with it are still read)
    previous-key: ${APP_SECRETS_KEY_PREVIOUS:}
